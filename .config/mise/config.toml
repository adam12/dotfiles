[tools]
usage = "3.3.0"
ruby = "4.0.5"
rust = "1.95.0"
python = "3.14.5"
bun = "1.3.14"
"cargo:ivm" = "0.6.0"
erlang = "28"
elixir = "1.19"
yarn = "4.15.0"
watchexec = "2.5.1"
node = "26.2.0"
gleam = "1.13.0"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["ruby"]

# Fix issues with ruby not having newer default OpenSSL versions on macOS
ruby.ruby_build_opts = "--with-openssl-dir=/opt/homebrew/opt/openssl@3.5"

[env]
OVERMIND_SKIP_ENV = "true"
OVERMIND_PROCFILE = "Procfile.dev"
OVERMIND_NO_PORT = 1
PGGSSENCMODE = "disable"

[bootstrap.macos.finder]
show_all_files = true

[bootstrap.macos.keyboard]
initial_key_repeat = 20
key_repeat = 2
press_and_hold = false

[bootstrap.macos.dock]
autohide = true

[bootstrap.hooks]
post-defaults = [
  "chflags nohidden ~/Library",
  "chflags nohidden /Volumes",
]
